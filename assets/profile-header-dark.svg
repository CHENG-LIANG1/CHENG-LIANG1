<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Liang Cheng — AI-native product engineer</title>
  <desc id="desc">Dark profile banner with orbiting nodes representing agents, frontend systems, and indie iOS products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.52" stop-color="#11162A"/>
      <stop offset="1" stop-color="#17102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A78BFA" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="178" r="230" fill="url(#orb)"/>
  <path d="M0 322C270 270 420 370 705 315S1010 285 1200 320" fill="none" stroke="url(#accent)" stroke-opacity="0.35"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="66" cy="50" r="6" fill="#34D399">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="56" fill="#94A3B8" font-size="14" letter-spacing="2">AVAILABLE FOR AMBITIOUS BUILDS</text>

    <text x="64" y="150" fill="#F8FAFC" font-size="62" font-weight="800" letter-spacing="3">LIANG CHENG</text>
    <rect x="66" y="170" width="515" height="4" rx="2" fill="url(#accent)"/>
    <text x="66" y="210" fill="#C4B5FD" font-size="21" font-weight="700" letter-spacing="4">AI-NATIVE PRODUCT ENGINEER</text>
    <text x="66" y="246" fill="#94A3B8" font-size="16">Agent systems · Full-stack products · Indie iOS</text>

    <g transform="translate(66 275)" font-size="12" font-weight="700" letter-spacing="1">
      <rect width="126" height="34" rx="17" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="63" y="22" fill="#67E8F9" text-anchor="middle">AGENT LOOPS</text>
      <rect x="138" width="116" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <text x="196" y="22" fill="#C4B5FD" text-anchor="middle">FRONTEND</text>
      <rect x="266" width="108" height="34" rx="17" fill="#F472B6" fill-opacity="0.1" stroke="#F472B6" stroke-opacity="0.55"/>
      <text x="320" y="22" fill="#F9A8D4" text-anchor="middle">INDIE iOS</text>
    </g>
  </g>

  <g transform="translate(985 180)" fill="none">
    <circle r="118" stroke="#A78BFA" stroke-opacity="0.22"/>
    <circle r="82" stroke="#22D3EE" stroke-opacity="0.28" stroke-dasharray="7 10"/>
    <circle r="42" stroke="#F472B6" stroke-opacity="0.38"/>
    <g filter="url(#glow)">
      <circle r="13" fill="#8B5CF6"/>
      <circle r="4" fill="#F8FAFC"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <circle cx="0" cy="-82" r="8" fill="#22D3EE"/>
      <circle cx="71" cy="41" r="7" fill="#F472B6"/>
      <circle cx="-71" cy="41" r="6" fill="#A78BFA"/>
      <path d="M0-82L71 41-71 41Z" stroke="url(#accent)" stroke-opacity="0.5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
      <circle cx="0" cy="-118" r="5" fill="#34D399"/>
      <circle cx="102" cy="59" r="5" fill="#F59E0B"/>
      <circle cx="-102" cy="59" r="5" fill="#38BDF8"/>
    </g>
  </g>

  <text x="1138" y="332" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">github.com/CHENG-LIANG1</text>
</svg>
