<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Liang Cheng — AI-native product engineer</title>
  <desc id="desc">Light profile banner with orbiting nodes representing agents, frontend systems, and indie iOS products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7C3AED" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="178" r="230" fill="url(#orb)"/>
  <path d="M0 322C270 270 420 370 705 315S1010 285 1200 320" fill="none" stroke="url(#accent)" stroke-opacity="0.25"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="66" cy="50" r="6" fill="#059669">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="56" fill="#64748B" font-size="14" letter-spacing="2">AVAILABLE FOR AMBITIOUS BUILDS</text>

    <text x="64" y="150" fill="#0F172A" font-size="62" font-weight="800" letter-spacing="3">LIANG CHENG</text>
    <rect x="66" y="170" width="515" height="4" rx="2" fill="url(#accent)"/>
    <text x="66" y="210" fill="#6D28D9" font-size="21" font-weight="700" letter-spacing="4">AI-NATIVE PRODUCT ENGINEER</text>
    <text x="66" y="246" fill="#475569" font-size="16">Agent systems · Full-stack products · Indie iOS</text>

    <g transform="translate(66 275)" font-size="12" font-weight="700" letter-spacing="1">
      <rect width="126" height="34" rx="17" fill="#CFFAFE" stroke="#0891B2" stroke-opacity="0.5"/>
      <text x="63" y="22" fill="#0E7490" text-anchor="middle">AGENT LOOPS</text>
      <rect x="138" width="116" height="34" rx="17" fill="#EDE9FE" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text x="196" y="22" fill="#6D28D9" text-anchor="middle">FRONTEND</text>
      <rect x="266" width="108" height="34" rx="17" fill="#FCE7F3" stroke="#DB2777" stroke-opacity="0.45"/>
      <text x="320" y="22" fill="#BE185D" text-anchor="middle">INDIE iOS</text>
    </g>
  </g>

  <g transform="translate(985 180)" fill="none">
    <circle r="118" stroke="#7C3AED" stroke-opacity="0.18"/>
    <circle r="82" stroke="#0891B2" stroke-opacity="0.26" stroke-dasharray="7 10"/>
    <circle r="42" stroke="#DB2777" stroke-opacity="0.3"/>
    <g filter="url(#glow)">
      <circle r="13" fill="#7C3AED"/>
      <circle r="4" fill="#FFFFFF"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <circle cx="0" cy="-82" r="8" fill="#0891B2"/>
      <circle cx="71" cy="41" r="7" fill="#DB2777"/>
      <circle cx="-71" cy="41" r="6" fill="#7C3AED"/>
      <path d="M0-82L71 41-71 41Z" stroke="url(#accent)" stroke-opacity="0.4"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
      <circle cx="0" cy="-118" r="5" fill="#059669"/>
      <circle cx="102" cy="59" r="5" fill="#D97706"/>
      <circle cx="-102" cy="59" r="5" fill="#0284C7"/>
    </g>
  </g>

  <text x="1138" y="332" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">github.com/CHENG-LIANG1</text>
</svg>
